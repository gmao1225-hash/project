<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한끼맛집 · 맛집 & 가성비 식당</title>
  <meta name="description" content="동네 맛집과 가성비 좋은 식당을 한눈에 찾아보세요." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- component: global-nav -->
  <header class="global-nav">
    <div class="global-nav-inner">
      <a href="#top" class="global-nav-logo">한끼맛집</a>
      <nav class="global-nav-links" id="global-links" aria-label="주 메뉴">
        <button class="nav-link" data-mode="all">전체</button>
        <button class="nav-link" data-mode="value">가성비</button>
        <button class="nav-link" data-mode="best">맛집</button>
        <button class="nav-link" data-mode="fav">찜</button>
      </nav>
      <button class="global-nav-toggle" id="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="global-links">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <!-- component: sub-nav-frosted -->
  <div class="sub-nav-frosted">
    <div class="sub-nav-inner">
      <span class="sub-nav-title" id="sub-nav-title">전체 식당</span>
      <div class="sub-nav-right">
        <a href="#featured" class="sub-nav-link">이번 주 추천</a>
        <a href="#list" class="sub-nav-link">식당 목록</a>
        <button class="btn-primary btn-compact" data-mode="fav">찜 목록</button>
      </div>
    </div>
  </div>

  <main id="top">
    <!-- component: product-tile-light (hero) -->
    <section class="tile tile-light hero">
      <h1 class="hero-display">오늘 뭐 먹지?</h1>
      <p class="lead">맛있고, 착한 가격의 식당만.</p>
      <div class="cta-row">
        <button class="btn-primary" data-mode="value">가성비 식당 보기</button>
        <button class="btn-secondary-pill" data-mode="best">맛집 보기</button>
      </div>
      <!-- component: search-input -->
      <label class="search-input">
        <svg class="search-icon" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="식당 이름, 지역, 태그로 검색" autocomplete="off" aria-label="식당 검색" />
      </label>
      <div class="hero-render" aria-hidden="true">🍜</div>
    </section>

    <!-- component: product-tile-dark (featured) -->
    <section class="tile tile-dark" id="featured" aria-labelledby="featured-name">
      <p class="tagline eyebrow-on-dark">이번 주 가성비 1위</p>
      <h2 class="display-lg" id="featured-name"></h2>
      <p class="lead lead-on-dark" id="featured-desc"></p>
      <div class="cta-row">
        <button class="btn-primary" id="featured-detail">자세히 보기</button>
        <button class="btn-secondary-pill" id="featured-fav"></button>
      </div>
      <div class="hero-render" id="featured-render" aria-hidden="true"></div>
    </section>

    <!-- component: product-tile-parchment (list) -->
    <section class="tile tile-parchment tile-list" id="list" aria-label="식당 목록">
      <div class="container-wide">
        <h2 class="display-md">식당 둘러보기</h2>

        <div class="filters">
          <div class="chips" id="category-chips" role="group" aria-label="카테고리"></div>
          <div class="filter-row">
            <label class="select-pill">
              <span>최대 가격</span>
              <select id="max-price">
                <option value="Infinity">제한 없음</option>
                <option value="7000">7,000원 이하</option>
                <option value="10000">10,000원 이하</option>
                <option value="15000">15,000원 이하</option>
                <option value="20000">20,000원 이하</option>
              </select>
            </label>
            <label class="select-pill">
              <span>정렬</span>
              <select id="sort">
                <option value="score">추천순</option>
                <option value="rating">평점 높은순</option>
                <option value="price">가격 낮은순</option>
                <option value="reviews">리뷰 많은순</option>
              </select>
            </label>
            <p class="caption result-count" id="result-count"></p>
          </div>
        </div>

        <div class="grid" id="grid" aria-live="polite"></div>
        <p class="empty body" id="empty" hidden>조건에 맞는 식당이 없어요. 필터를 바꿔보세요.</p>
      </div>
    </section>
  </main>

  <!-- component: footer -->
  <footer class="footer">
    <div class="container-wide">
      <div class="footer-cols">
        <div>
          <h3 class="caption-strong">둘러보기</h3>
          <ul class="dense-link">
            <li><button class="footer-link" data-mode="all">전체 식당</button></li>
            <li><button class="footer-link" data-mode="value">가성비 식당</button></li>
            <li><button class="footer-link" data-mode="best">맛집</button></li>
            <li><button class="footer-link" data-mode="fav">찜 목록</button></li>
          </ul>
        </div>
        <div>
          <h3 class="caption-strong">카테고리</h3>
          <ul class="dense-link" id="footer-cats"></ul>
        </div>
        <div>
          <h3 class="caption-strong">안내</h3>
          <ul class="dense-link">
            <li>가성비 점수 = 평점 60% + 가격 40%</li>
            <li>1인 1만 원 이하 식당은 가성비로 분류</li>
          </ul>
        </div>
      </div>
      <p class="fine-print">© 2026 한끼맛집 · 표시된 식당 정보는 샘플 데이터입니다.</p>
    </div>
  </footer>

  <dialog id="detail" class="detail">
    <div id="detail-body"></div>
    <form method="dialog"><button class="btn-icon-circular detail-close" aria-label="닫기">✕</button></form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
